<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso personal | Dulce Bocado</title><script src="https://cdn.tailwindcss.com"></script><script src="staff-auth.bundle.js" defer></script><style>body{background:linear-gradient(145deg,#fff2f8,#e9f8ff,#f3edff);color:#3d204b}.neon{box-shadow:0 0 22px #9b6cdf55;border:1px solid #9b6cdf77}</style></head><body data-staff-login="true" class="min-h-screen flex items-center justify-center p-5"><main class="neon bg-white rounded-3xl p-6 w-full max-w-sm"><img src="logo.png" class="w-24 h-24 object-contain mx-auto"><h1 class="text-2xl font-black text-center">Acceso del personal</h1><p class="text-sm text-center mt-2">Esta zona está protegida. Los clientes no necesitan entrar aquí.</p><form id="login-form" class="space-y-4 mt-6"><label class="block font-bold">Nombre clave<input id="staff-alias" required autocomplete="username" class="block w-full mt-1 p-3 rounded-xl border-2 border-purple-200" placeholder="Ej. Maradona"></label><label class="block font-bold">Contraseña<input id="staff-password" type="password" required autocomplete="current-password" class="block w-full mt-1 p-3 rounded-xl border-2 border-purple-200"></label><fieldset><legend class="font-bold">¿A dónde entrarás?</legend><div class="grid gap-2 mt-2"><label><input type="radio" name="area" value="mesero.html" checked> 📱 Mesero / caja</label><label><input type="radio" name="area" value="cocina.html"> 🍳 Cocina</label><label><input type="radio" name="area" value="admin.html"> ⚙️ Dueño / administración</label></div></fieldset><button class="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-xl p-3 font-black">Entrar</button><p id="login-message" class="text-sm text-red-600 text-center min-h-5"></p></form><div id="session-card" class="hidden text-center mt-5"><p class="font-bold">Ya tienes una sesión activa.</p><button id="staff-logout" class="underline mt-2">Cerrar sesión</button></div><a href="index.html" class="block text-center mt-5 underline">Volver al menú</a><p class="text-xs text-gray-500 mt-5">La contraseña se crea al aceptar la invitación enviada al correo del dueño.</p></main></body></html>
