<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DULCE BOCADO - Bienvenido </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            /* CAMBIA 'fondo.png' por el nombre exacto con el que guardaste tu imagen en GitHub */
            background-image: url('patron.png');
            background-repeat: repeat;
            background-size: 250px;
            background-attachment: fixed;
            background-color: #B695C0;
        }
        .bg-dark-overlay {
            background-color: rgba(41, 13, 47, 0.88);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LOGOTIPO OFICIAL -->
    <div class="mb-6 text-center animate__animated animate__fadeInDown bg-dark-overlay p-5 rounded-3xl shadow-xl border border-pink-400/20">
        <img src="logo.png" alt="Dulce Bocado Logo" class="w-28 h-28 mx-auto object-contain rounded-full border-2 border-pink-400 shadow-lg mb-2">
        <h1 class="text-3xl font-black text-pink-300 tracking-wider">DULCE BOCADO</h1>
        <p class="text-xs text-purple-300 uppercase tracking-widest mt-1">SISTEMA POS OFICIAL - DB</p>
    </div>

    <!-- TARJETA DE ACCESO -->
    <div class="bg-dark-overlay border border-purple-900/80 p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center animate__animated animate__fadeInUp">
        <h2 class="text-sm font-bold text-purple-200 mb-5">¿Quién ingresa al sistema?</h2>
        
        <div class="space-y-3">
            <a href="cliente.html" class="block w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 px-4 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                🥤 Soy Cliente (Hacer Pedido)
            </a>
            <a href="mesero.html" class="block w-full bg-purple-700 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                🥞 Soy Mesero / Colaborador
            </a>
            <a href="cocina.html" class="block w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                🍳 Soy Cocinero (Comandas)
            </a>
            <a href="admin.html" class="block w-full bg-gray-900 hover:bg-gray-800 border border-purple-900 text-purple-300 font-bold py-2.5 px-4 rounded-xl transition text-xs">
                🔒 Acceso Exclusivo Dueño
            </a>
        </div>
    </div>

    <!-- PERSONAJES OFICIALES DECORATIVOS -->
    <div class="flex justify-center space-x-4 mt-8 opacity-100 bg-dark-overlay p-3 rounded-full shadow-inner">
        <img src="fran.png" alt="Fran" class="w-12 h-12 object-contain animate__animated animate__bounceIn">
        <img src="talia.png" alt="Talia" class="w-12 h-12 object-contain animate__animated animate__bounceIn" style="animation-delay: 0.2s;">
        <img src="moy.png" alt="Moy" class="w-12 h-12 object-contain animate__animated animate__bounceIn" style="animation-delay: 0.4s;">
    </div>

</body>
</html>
