<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DULCE BOCADO - Panel Dueño & Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #3b1443; background-image: url('patron.png'); background-repeat: repeat; background-blend-mode: overlay; }
        .bg-dark-overlay { background-color: rgba(41, 13, 47, 0.96); backdrop-filter: blur(6px); }
        .marco-admin { border: 2px solid #f59e0b; border-radius: 1rem; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2); }
    </style>
</head>
<body class="text-white min-h-screen p-3 md:p-6 pb-20">

    <header class="flex justify-between items-center bg-dark-overlay p-4 marco-admin mb-4">
        <div>
            <h1 class="text-base font-black text-amber-400">⚙️ Panel del Dueño & Gestor de Menú</h1>
            <p class="text-[10px] text-purple-300">Control de Caja y Productos en Tiempo Real</p>
        </div>
        <div class="flex space-x-2">
            <a href="mesero.html" class="bg-purple-900 text-xs font-bold px-3 py-2 rounded-xl">📱 POS</a>
            <a href="cocina.html" class="bg-blue-600 text-xs font-bold px-3 py-2 rounded-xl">🍳 Cocina</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-4">
        <!-- RESUMEN DE VENTAS -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-dark-overlay p-4 marco-admin text-center">
                <span class="text-[10px] text-gray-300 uppercase font-bold">Ventas Totales Cobradas</span>
                <h2 id="lbl-ventas-totales" class="text-xl font-black text-green-400 mt-1">$0.00</h2>
            </div>
            <div class="bg-dark-overlay p-4 marco-admin text-center">
                <span class="text-[10px] text-gray-300 uppercase font-bold">Órdenes Cobradas</span>
                <h2 id="lbl-ordenes-cobradas" class="text-xl font-black text-amber-300 mt-1">0</h2>
            </div>
        </div>

        <!-- GESTOR DE PRODUCTOS Y MENÚ -->
        <section class="bg-dark-overlay p-4 marco-admin space-y-3">
            <h2 class="text-xs font-black text-amber-300 uppercase">🍔 Agregar / Quitar Productos del Menú</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-2 bg-purple-950/60 p-3 rounded-xl border border-amber-500/30 text-xs">
                <select id="nuevo-cat" class="bg-purple-900 border border-purple-700 rounded p-2 text-white">
                    <option value="crepasEspeciales">Crepa Especial</option>
                    <option value="frappesBasicos">Frappe Básico</option>
                    <option value="frappesPremium">Frappe Premium</option>
                    <option value="frappesEspeciales">Frappe Especial</option>
                    <option value="chamoyadas">Chamoyada</option>
                    <option value="sodas">Soda Italiana</option>
                </select>
                <input type="text" id="nuevo-nombre" placeholder="Nombre producto..." class="bg-purple-900 border border-purple-700 rounded p-2 text-white">
                <input type="number" id="nuevo-precio" placeholder="Precio ($)..." class="bg-purple-900 border border-purple-700 rounded p-2 text-white">
                <button onclick="agregarNuevoProducto()" class="bg-emerald-600 hover:bg-emerald-500 font-bold p-2 rounded text-white shadow">➕ Añadir Producto</button>
            </div>
            <div id="lista-productos-admin" class="space-y-1 max-h-48 overflow-y-auto pr-1"></div>
        </section>

        <!-- HISTORIAL DE COBROS -->
        <section class="bg-dark-overlay p-4 marco-admin space-y-3">
            <h2 class="text-xs font-black text-amber-300 uppercase">📊 Historial de Cuentas Cobradas</h2>
            <div id="contenedor-historial-cobrados" class="space-y-2"></div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwvgekDaMBkfiewGaT1duGmb5iIqSvLLI",
            authDomain: "dulcebocado.firebaseapp.com",
            projectId: "dulcebocado",
            storageBucket: "dulcebocado.appspot.com",
            messagingSenderId: "1086223287499",
            appId: "1:1086223287499:web:4f9fd420e53a1eb3f4474e"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        function escucharAdmin() {
            db.collection("orders").onSnapshot((snapshot) => {
                let orders = [];
                snapshot.forEach((doc) => { orders.push({ firestoreId: doc.id, ...doc.data() }); });
                renderAdmin(orders);
            });
            renderGestorMenu();
        }

        function getConfig() {
            let defaults = {
                frappesBasicos: [
                    {id:"fb1", name:"Moka", med:50, gde:60, jumbo:120, img:"Capuchino.png", activo:true},
                    {id:"fb2", name:"Capuchino", med:50, gde:60, jumbo:120, img:"Capuchino.png", activo:true},
                    {id:"fb3", name:"Fresa", med:50, gde:60, jumbo:120, img:"Fresa Frappe.png", activo:true}
                ],
                frappesPremium: [
                    {id:"fp1", name:"Ferrero Rocher", med:70, gde:75, jumbo:150, img:"Ferrero rocher.png", activo:true},
                    {id:"fp2", name:"Kinder Délice", med:70, gde:75, jumbo:150, img:"Quinder delice.png", activo:true},
                    {id:"fp3", name:"Gansito", med:70, gde:75, jumbo:150, img:"Gansito.png", activo:true},
                    {id:"fp4", name:"Bubu Lubu", med:70, gde:75, jumbo:150, img:"Bubulubu.png", activo:true}
                ],
                frappesEspeciales: [
                    {id:"fe1", name:"M&M's", med:65, gde:70, jumbo:140, img:"Chocolate Frappe.png", activo:true},
                    {id:"fe2", name:"Oreo", med:65, gde:70, jumbo:140, img:"Oreo.png", activo:true},
                    {id:"fe3", name:"Taro", med:65, gde:70, jumbo:140, img:"Taro.png", activo:true},
                    {id:"fe4", name:"Carlos V", med:65, gde:70, jumbo:140, img:"Carlos V.png", activo:true}
                ],
                crepasEspeciales: [
                    {id:"ce1", name:"Crepa Ferrero", desc:"Nutella, Nuez, Almendra, Ferrero", precio:90, img:"Crepa Fererro.png", activo:true},
                    {id:"ce2", name:"Crepa Gansito", desc:"Nutella, Philadelphia, Fresa, Gansito", precio:90, img:"Crepa Gansito.png", activo:true},
                    {id:"ce3", name:"Crepa Kinder", desc:"Nutella, Philadelphia, Kinder Délice", precio:95, img:"Crepa Basica.png", activo:true},
                    {id:"ce4", name:"Crepa Oreo", desc:"Nutella, Lechera, Oreo", precio:85, img:"Crepa Oreo.png", activo:true}
                ],
                chamoyadas: [
                    {id:"ch1", name:"PicaFresa", precio:60, img:"Chamoyada Fresa.png", activo:true},
                    {id:"ch2", name:"Mango", precio:60, img:"Chamoyada Mango.png", activo:true}
                ],
                sodas: [
                    {id:"so1", name:"Blue", precio:60, img:"Blu.png", activo:true},
                    {id:"so2", name:"Green", precio:60, img:"Manzanaverde.png", activo:true},
                    {id:"so3", name:"Cereza", precio:60, img:"Cereza.png", activo:true}
                ],
                ingredientes: ["Nutella", "Cajeta", "Queso Philadelphia", "Mermelada Fresa", "Lechera", "Fresa", "Plátano", "Durazno", "Nuez", "Almendra", "Chispas de chocolate", "Crema Batida"]
            };
            return JSON.parse(localStorage.getItem("db_config_dulce")) || defaults;
        }

        function renderGestorMenu() {
            let config = getConfig();
            let container = document.getElementById('lista-productos-admin');
            container.innerHTML = '';
            
            let categorias = ['crepasEspeciales', 'frappesBasicos', 'frappesPremium', 'frappesEspeciales', 'chamoyadas', 'sodas'];
            categorias.forEach(cat => {
                if(config[cat]) {
                    config[cat].forEach((item, idx) => {
                        let precioTxt = item.precio ? `$${item.precio}` : `Med: $${item.med}`;
                        container.innerHTML += `
                            <div class="bg-purple-950/80 p-2 rounded-lg border border-amber-500/30 flex justify-between items-center text-xs">
                                <div>
                                    <span class="font-bold text-white">${item.name}</span>
                                    <span class="text-[10px] text-purple-300 ml-2">(${cat}) - ${precioTxt}</span>
                                </div>
                                <button onclick="eliminarProductoMenu('${cat}', ${idx})" class="bg-red-900 hover:bg-red-800 text-white font-bold px-2 py-1 rounded text-[10px]">🗑️ Quitar</button>
                            </div>`;
                    });
                }
            });
        }

        function agregarNuevoProducto() {
            let cat = document.getElementById('nuevo-cat').value;
            let name = document.getElementById('nuevo-nombre').value.trim();
            let precio = parseFloat(document.getElementById('nuevo-precio').value);

            if(!name || isNaN(precio)) { alert("Ingresa nombre y precio válido."); return; }

            let config = getConfig();
            let nuevoItem = {
                id: "prod_" + Date.now(),
                name: name,
                activo: true
            };

            if(cat.includes('frappes')) {
                nuevoItem.med = precio;
                nuevoItem.gde = precio + 10;
                nuevoItem.jumbo = precio + 60;
                nuevoItem.img = "Capuchino.png";
            } else {
                nuevoItem.precio = precio;
                nuevoItem.img = "Crepa Basica.png";
            }

            config[cat].push(nuevoItem);
            localStorage.setItem("db_config_dulce", JSON.stringify(config));
            document.getElementById('nuevo-nombre').value = '';
            document.getElementById('nuevo-precio').value = '';
            renderGestorMenu();
            alert("✨ Producto agregado al menú con éxito.");
        }

        function eliminarProductoMenu(cat, idx) {
            if(confirm("¿Eliminar este producto del menú?")) {
                let config = getConfig();
                config[cat].splice(idx, 1);
                localStorage.setItem("db_config_dulce", JSON.stringify(config));
                renderGestorMenu();
            }
        }

        function renderAdmin(orders) {
            let cobradas = orders.filter(o => o.estado === 'cobrado');
            let totalVentas = cobradas.reduce((acc, o) => acc + (o.total || 0), 0);

            document.getElementById('lbl-ventas-totales').innerText = `$${totalVentas.toFixed(2)}`;
            document.getElementById('lbl-ordenes-cobradas').innerText = cobradas.length;

            let contenedor = document.getElementById('contenedor-historial-cobrados');
            contenedor.innerHTML = '';

            if (cobradas.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-gray-400 italic text-center py-4">No hay cuentas cobradas todavía.</p>`;
                return;
            }

            cobradas.slice().reverse().forEach(orden => {
                let itemsTxt = orden.items.map(i => i.name).join(', ');
                contenedor.innerHTML += `
                    <div class="p-3 rounded-xl border border-amber-500/30 bg-purple-950/60 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-black text-amber-300">Orden #${orden.id} - ${orden.cliente}</span>
                            <p class="text-[10px] text-gray-300 truncate w-60">Items: ${itemsTxt}</p>
                            <p class="text-[9px] text-gray-400">🕒 ${orden.fecha} ${orden.tiempo} | Pago: <b>${orden.pagoMetodo || 'Efectivo'}</b></p>
                        </div>
                        <div class="text-right">
                            <span class="font-black text-green-400 text-sm">$${(orden.total || 0).toFixed(2)}</span>
                            <button onclick="eliminarHistorial('${orden.id}')" class="block text-[10px] text-red-400 underline mt-1 ml-auto">Eliminar</button>
                        </div>
                    </div>`;
            });
        }

        function eliminarHistorial(id) {
            if(confirm("¿Eliminar este registro del historial?")) {
                db.collection("orders").doc(id.toString()).delete();
            }
        }

        window.onload = escucharAdmin;
    </script>
</body>
</html>
