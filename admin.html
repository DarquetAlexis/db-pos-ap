<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB - Panel de Dueño</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.bg-morado-uva { background-color: #3b1443; }</style>
</head>
<body class="bg-morado-uva text-white min-h-screen p-4">
    <header class="flex justify-between items-center mb-6 border-b border-purple-900 pb-3">
        <h1 class="text-2xl font-black text-pink-300">⚙️ PANEL DE CONTROL (DUEÑO)</h1>
        <a href="index.html" class="bg-purple-800 px-3 py-1 rounded-lg text-xs">Cerrar Sesión</a>
    </header>

    <div class="max-w-2xl mx-auto bg-[#290d2f] p-6 rounded-2xl border border-purple-900">
        <h2 class="text-lg font-bold mb-4 text-purple-200">Ajustes Rápidos de Precios</h2>
        <p class="text-sm text-purple-300 mb-4">Aquí puedes modificar los costos base de las crepas o ingredientes adicionales.</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-purple-300 mb-1">Precio Base Crepa (Sin ingredientes):</label>
                <input type="number" id="input-base-crepa" value="50" class="w-full bg-purple-950 border border-purple-700 rounded-lg p-2 text-white">
            </div>
            <div>
                <label class="block text-xs font-bold text-purple-300 mb-1">Costo por Ingrediente Extra:</label>
                <input type="number" id="input-extra-crepa" value="10" class="w-full bg-purple-950 border border-purple-700 rounded-lg p-2 text-white">
            </div>
            <button onclick="guardarCambios()" class="w-full bg-pink-600 hover:bg-pink-500 font-bold py-2.5 rounded-xl transition">
                Guardar Configuración
            </button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function guardarCambios() {
            let menu = getMenu();
            menu.crepas.basePrecio = parseInt(document.getElementById('input-base-crepa').value);
            menu.crepas.extraPorIngrediente = parseInt(document.getElementById('input-extra-crepa').value);
            localStorage.setItem("db_dulce_bocado_data", JSON.stringify(menu));
            alert("¡Configuración actualizada correctamente!");
        }
    </script>
</body>
</html>
