<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DULCE BOCADO - Área de Cocina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #3b1443; background-image: url('patron.png'); background-repeat: repeat; background-blend-mode: overlay; }
        .bg-dark-overlay { background-color: rgba(41, 13, 47, 0.96); backdrop-filter: blur(6px); }
        .marco-cocina { border: 2px solid #3b82f6; border-radius: 1rem; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="text-white min-h-screen p-3 md:p-6 pb-20">

    <header class="flex justify-between items-center bg-dark-overlay p-4 marco-cocina mb-4">
        <div>
            <h1 class="text-base font-black text-blue-400">🍳 Pantalla de Cocina y Comandas</h1>
            <p class="text-[10px] text-purple-300">Sincronizado con Mesero y Dueño</p>
        </div>
        <div class="flex space-x-2">
            <button onclick="cargarComandas()" class="bg-blue-600 hover:bg-blue-500 text-xs font-bold px-3 py-2 rounded-xl shadow">🔄 Actualizar</button>
            <a href="mesero.html" class="bg-purple-900 hover:bg-purple-800 text-xs font-bold px-3 py-2 rounded-xl">📱 POS</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto space-y-4">
        <section class="bg-dark-overlay p-4 marco-cocina space-y-3">
            <h2 class="text-xs font-black text-blue-300 uppercase">📋 Comandas Activas e Historial</h2>
            <div id="contenedor-comandas" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>
    </main>

    <script>
        function cargarComandas() {
            let orders = JSON.parse(localStorage.getItem("db_orders")) || [];
            let contenedor = document.getElementById('contenedor-comandas');
            contenedor.innerHTML = '';

            if (orders.length === 0) {
                contenedor.innerHTML = `<p class="text-xs text-gray-400 italic col-span-2 text-center py-6">No hay comandas registradas en este momento.</p>`;
                return;
            }

            // Mostramos los pedidos del más reciente al más antiguo
            orders.slice().reverse().forEach((orden, index) => {
                let realIndex = orders.length - 1 - index;
                let colorEstado = orden.estado === 'listo' ? 'border-green-500 bg-green-950/40' : 'border-blue-500/50 bg-purple-950/80';
                
                let listaItems = '';
                orden.items.forEach(item => {
                    listaItems += `<li class="text-xs text-gray-200 flex justify-between"><span>• ${item.name}</span> <span class="font-bold text-pink-300">$${item.precio}</span></li>`;
                });

                contenedor.innerHTML += `
                    <div class="p-3 rounded-xl border ${colorEstado} space-y-2 shadow-lg">
                        <div class="flex justify-between items-center border-b border-purple-900 pb-1">
                            <div>
                                <span class="text-xs font-black text-amber-300">Cliente: ${orden.cliente}</span>
                                <p class="text-[9px] text-gray-400">🕒 ${orden.tiempo} | Pago: <b>${orden.pago || 'Efectivo'}</b></p>
                            </div>
                            <span class="text-[10px] px-2 py-0.5 rounded font-bold ${orden.estado === 'listo' ? 'bg-green-600 text-white' : 'bg-amber-600 text-white'}">${orden.estado.toUpperCase()}</span>
                        </div>
                        <ul class="space-y-1 my-1">
                            ${listaItems}
                        </ul>
                        <div class="flex justify-between items-center pt-2 border-t border-purple-900/60 text-xs">
                            <span class="font-bold text-pink-300">Total: $${orden.total.toFixed(2)}</span>
                            <div class="space-x-1">
                                <button onclick="cambiarEstado(${realIndex}, 'listo')" class="bg-green-600 hover:bg-green-500 text-[10px] font-bold px-2.5 py-1 rounded">✅ Listo</button>
                                <button onclick="eliminarComanda(${realIndex})" class="bg-red-900 hover:bg-red-800 text-[10px] font-bold px-2 py-1 rounded">🗑️</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function cambiarEstado(index, nuevoEstado) {
            let orders = JSON.parse(localStorage.getItem("db_orders")) || [];
            orders[index].estado = nuevoEstado;
            localStorage.setItem("db_orders", JSON.stringify(orders));
            cargarComandas();
        }

        function eliminarComanda(index) {
            if(confirm("¿Eliminar esta comanda del historial?")) {
                let orders = JSON.parse(localStorage.getItem("db_orders")) || [];
                orders.splice(index, 1);
                localStorage.setItem("db_orders", JSON.stringify(orders));
                cargarComandas();
            }
        }

        // Auto-actualizar cada 3 segundos para sincronización instantánea
        setInterval(cargarComandas, 3000);
        window.onload = cargarComandas;
    </script>
</body>
</html>
