<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DULCE BOCADO - Módulo Mesero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .bg-morado-uva { background-color: #3b1443; }
        .bg-dark-overlay { background-color: rgba(41, 13, 47, 0.90); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="bg-morado-uva text-white min-h-screen flex flex-col p-4">

    <!-- ENCABEZADO -->
    <header class="flex justify-between items-center mb-6 bg-dark-overlay p-4 rounded-2xl border border-purple-900/80 shadow-lg">
        <div>
            <h1 class="text-xl font-black text-pink-300">🥞 Módulo de Mesero / Colaborador</h1>
            <p class="text-xs text-purple-300">Dulce Bocado - Toma de Pedidos</p>
        </div>
        <a href="index.html" class="bg-purple-900 hover:bg-purple-800 text-purple-200 px-4 py-2 rounded-xl text-xs font-bold transition">
            🏠 Volver al Inicio
        </a>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto w-full">
        
        <!-- MENÚ DE PRODUCTOS -->
        <div class="md:col-span-2 space-y-4">
            <div class="bg-dark-overlay p-4 rounded-2xl border border-purple-900/80 shadow-xl">
                <h2 class="text-lg font-bold text-pink-300 mb-3">Menú Disponible</h2>
                <div id="menu-container" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                    <!-- Se carga dinámicamente desde app.js -->
                </div>
            </div>
        </div>

        <!-- CARRITO Y ORDEN -->
        <div class="bg-dark-overlay p-4 rounded-2xl border border-purple-900/80 flex flex-col justify-between shadow-xl">
            <div>
                <h2 class="text-lg font-bold text-pink-300 mb-2">Orden Actual</h2>
                
                <!-- CAMPO PARA NOMBRE DE CLIENTE -->
                <div class="mb-3">
                    <label class="block text-xs text-purple-300 mb-1">Nombre o Referencia del Cliente:</label>
                    <input type="text" id="nombre-cliente" placeholder="Ej. Cliente 1 o Juan" class="w-full bg-purple-950 border border-purple-800 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>

                <div id="carrito-items" class="space-y-2 max-h-[200px] overflow-y-auto text-sm">
                    <p class="text-gray-400 text-center py-6">No hay productos añadidos.</p>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-purple-900">
                <div class="flex justify-between text-xl font-black mb-4">
                    <span>Total:</span>
                    <span id="carrito-total" class="text-pink-300">$0.00</span>
                </div>
                <button onclick="enviarOrden()" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3 rounded-xl shadow-lg transition transform active:scale-95">
                    🚀 Enviar a Cocina
                </button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE LÓGICA DE MESERO -->
    <script src="app.js"></script>
    <script>
        let carrito = [];

        function cargarMenu() {
            const menu = getMenu();
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            // Cargar Frappes
            for (let categoria in menu.frappes) {
                menu.frappes[categoria].forEach(item => {
                    container.innerHTML += `
                        <div class="bg-purple-950/60 p-3 rounded-xl border border-purple-900 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm text-white">${item.name} <span class="text-xs text-purple-400">(${categoria})</span></h3>
                                <p class="text-xs text-pink-300">Mediano: $${item.mediano} | Grande: $${item.grande}</p>
                            </div>
                            <div class="space-x-1">
                                <button onclick="agregarAlCarrito('${item.name} (Mediano)', ${item.mediano})" class="bg-pink-600 hover:bg-pink-500 text-xs px-2 py-1.5 rounded-lg font-bold">Med</button>
                                <button onclick="agregarAlCarrito('${item.name} (Grande)', ${item.grande})" class="bg-purple-700 hover:bg-purple-600 text-xs px-2 py-1.5 rounded-lg font-bold">Gde</button>
                            </div>
                        </div>
                    `;
                });
            }

            // Cargar Crepas
            for (let tipo in menu.crepas) {
                menu.crepas[tipo].forEach(item => {
                    container.innerHTML += `
                        <div class="bg-purple-950/60 p-3 rounded-xl border border-purple-900 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-sm text-white">${item.name}</h3>
                                <p class="text-[11px] text-gray-300">${item.descripcion || ''}</p>
                                <p class="text-xs text-pink-300 font-bold">$${item.precio}</p>
                            </div>
                            <button onclick="agregarAlCarrito('${item.name}', ${item.precio})" class="bg-pink-600 hover:bg-pink-500 text-xs px-3 py-2 rounded-lg font-bold">Agregar</button>
                        </div>
                    `;
                });
            }

            // Cargar Chamoyadas y Sodas
            ['chamoyadas', 'sodas'].forEach(cat => {
                if(menu[cat]) {
                    menu[cat].forEach(item => {
                        container.innerHTML += `
                            <div class="bg-purple-950/60 p-3 rounded-xl border border-purple-900 flex justify-between items-center">
                                <div>
                                    <h3 class="font-bold text-sm text-white">${item.name}</h3>
                                    <p class="text-xs text-pink-300 font-bold">$${item.precio}</p>
                                </div>
                                <button onclick="agregarAlCarrito('${item.name}', ${item.precio})" class="bg-pink-600 hover:bg-pink-500 text-xs px-3 py-2 rounded-lg font-bold">Agregar</button>
                            </div>
                        `;
                    });
                }
            });
        }

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ name: nombre, precio: precio });
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const container = document.getElementById('carrito-items');
            const totalContainer = document.getElementById('carrito-total');
            
            if (carrito.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6">No hay productos añadidos.</p>`;
                totalContainer.innerText = "$0.00";
                return;
            }

            container.innerHTML = '';
            let total = 0;
            carrito.forEach((item, index) => {
                total += item.precio;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-purple-950 p-2 rounded-lg border border-purple-900">
                        <span class="text-xs">${item.name}</span>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-bold text-pink-300">$${item.precio}</span>
                            <button onclick="eliminarDelCarrito(${index})" class="text-red-400 hover:text-red-300 text-xs font-bold px-1">✕</button>
                        </div>
                    </div>
                `;
            });
            totalContainer.innerText = `$${total.toFixed(2)}`;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function enviarOrden() {
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            let nombreCliente = document.getElementById('nombre-cliente').value.trim();
            if (!nombreCliente) {
                nombreCliente = "Cliente General";
            }

            let orders = JSON.parse(localStorage.getItem("db_orders")) || [];
            let nuevaOrden = {
                id: Date.now().toString().slice(-4),
                cliente: nombreCliente,
                items: carrito,
                total: carrito.reduce((sum, item) => sum + item.precio, 0),
                estado: "pendiente",
                tiempo: new Date().toLocaleTimeString()
            };
            orders.push(nuevaOrden);
            localStorage.setItem("db_orders", JSON.stringify(orders));
            
            alert(`¡Orden de ${nombreCliente} enviada a cocina con éxito!`);
            carrito = [];
            document.getElementById('nombre-cliente').value = "";
            actualizarCarrito();
        }

        window.onload = cargarMenu;
    </script>
</body>
</html>
